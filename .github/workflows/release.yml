name: Release

# Pushing a tag like v0.1.0 builds the Linux packages (tarball, .deb, .rpm, AppImage) for x86-64 and ARM64,
# and a Flatpak bundle for x86-64, and publishes them as a GitHub release, then pushes the AUR packages (stable tags only). The version is the tag; nothing in the repository is bumped by hand.
# Running it by hand (Actions › Release › Run workflow) is a dry run: everything is built and
# uploaded as workflow artifacts, and nothing is published. PRs that change the packaging, or what
# it's built from (the toolchain, the crates' versions, the app's package metadata and the files it
# installs), run the same dry run: otherwise they'd break only at the next tag.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/**"
      - "scripts/**"
      - ".github/workflows/release.yml"
      - "rust-toolchain.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/app/Cargo.toml"
      - "crates/**/build.rs"
      - "crates/version.rs"
      - "crates/app/ui/fonts/*-LICENSE.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Build caches: tag runs can only restore them (a cache saved for a tag is visible to that tag
# alone), and they are saved by dry runs on main. Run one before tagging.

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      notes: ${{ steps.version.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tags, for a dry run's version
      # A tag's version is the tag; a dry run's comes from the tags before it (0.1.1-dev.5+g…).
      - id: version
        name: Version and release notes
        run: |
          notes=""
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
            if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::$GITHUB_REF_NAME is not a version tag like v1.2.3 or v1.2.3-rc.1"
              exit 1
            fi
            # The checkout may have turned an annotated tag into a lightweight one.
            git fetch --force origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
            if [ "$(git cat-file -t "$GITHUB_REF_NAME")" = tag ]; then
              notes=$(git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$GITHUB_REF_NAME")
            else
              echo "::warning::$GITHUB_REF_NAME has no message: the release has no notes of its own (tag with git tag -a)"
            fi
          else
            version=$(scripts/version.sh)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          { echo "notes<<END_OF_NOTES"; printf '%s\n' "$notes"; echo "END_OF_NOTES"; } >> "$GITHUB_OUTPUT"
          echo "Version $version"

  linux:
    name: linux (${{ matrix.arch }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    # Each architecture on its own native runner. Built on Debian 12 (glibc 2.36), so the
    # packages run on Debian 12, Ubuntu 22.04, and anything newer.
    runs-on: ${{ matrix.runner }}
    container: debian:12
    timeout-minutes: 60
    # In a container, steps run with sh unless told otherwise.
    defaults:
      run:
        shell: bash
    steps:
      - name: Build tools and system libraries
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl file git build-essential pkg-config \
            libfontconfig1-dev libxkbcommon-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust (the version in rust-toolchain.toml)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # After the cache step, so the cache key still matches main's. Never committed.
      - name: Set the version
        env:
          VERSION: ${{ needs.version.outputs.version }}
          RELEASE_NOTES: ${{ needs.version.outputs.notes }}
        run: scripts/set-version.sh "$VERSION"
      - run: cargo build --release --locked -p lituus
      - run: target/release/lituus --version
      - name: Binary archive
        env:
          VERSION: ${{ needs.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: scripts/package-tarball.sh "$VERSION" "$ARCH"
      # Packaging tools at fixed versions, at least two weeks old like every dependency.
      - name: .deb and .rpm
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cargo install --locked cargo-deb@3.8.0 cargo-generate-rpm@0.21.0
          cargo deb --no-build --locked -p lituus
          # RPM versions can't contain '-': a pre-release uses '~', which also sorts it before the
          # release (cargo-deb does the same for the .deb).
          cargo generate-rpm -p crates/app --set-metadata "version = \"${VERSION//-/\~}\"" \
            --set-metadata "requires = $(packaging/linux/rpm-requires.sh target/release/lituus)"
          cp target/debian/*.deb target/generate-rpm/*.rpm target/dist/
      - name: AppImage
        run: packaging/linux/build-appimage.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-${{ matrix.arch }}
          path: target/dist/*
          if-no-files-found: error

  flatpak:
    name: flatpak (x64)
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Flathub's own builder image, matching the manifest's runtime. Pinned by digest, like the actions
    # by commit, since the tag moves; the tag says which image it is.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08@sha256:6ed6921bb5a9e1a916989971844f159b854b7b225880c381fa34f7a158863039
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Before the build, like the other packages; the dir source copies the changed files.
      - name: Set the version
        env:
          VERSION: ${{ needs.version.outputs.version }}
          RELEASE_NOTES: ${{ needs.version.outputs.notes }}
        run: scripts/set-version.sh "$VERSION"
      # The image's runtimes sit in a lower overlay layer, and since the ubuntu24/20261111 runner
      # image updating them there fails with "Invalid cross-device link". A copy on the bind-mounted
      # workspace can be updated in place.
      - name: Move Flatpak's system installation off the image layers
        run: |
          cp -a /var/lib/flatpak "$RUNNER_TEMP/flatpak"
          echo "FLATPAK_SYSTEM_DIR=$RUNNER_TEMP/flatpak" >> "$GITHUB_ENV"
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: packaging/flatpak/ch.giosuel.Lituus.yml
          bundle: Lituus-${{ needs.version.outputs.version }}-linux-x64.flatpak
          # Inside .flatpak-builder, which the manifest's dir source skips.
          build-dir: .flatpak-builder/build
          repo-dir: .flatpak-builder/repo
          upload-artifact: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flatpak
          path: Lituus-*.flatpak
          if-no-files-found: error

  # CI's tests and checks on the tagged commit: a commit on main can be tagged before its own CI
  # run finished, or without one (v0.3.0's was never checked).
  ci:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    uses: ./.github/workflows/ci.yml

  # Only for a pushed tag: a run by hand on a tag is a dry run like any other.
  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [version, linux, flatpak, ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: "{linux-*,flatpak}"
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          NOTES: ${{ needs.version.outputs.notes }}
        run: |
          prerelease=""
          [[ "$VERSION" == *-* ]] && prerelease="--prerelease"
          # "Latest" only for the highest stable version. Runs of different tags aren't ordered, and
          # without --latest GitHub makes the release published last the latest, older or not.
          # Compared with the tags, not the releases: a newer tag's release only appears at the end
          # of its run.
          newest=$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --jq '.[].ref' |
            sed -n 's|^refs/tags/v\([0-9]*\.[0-9]*\.[0-9]*\)$|\1|p' | sort -V | tail -1)
          latest=false
          [[ -z "$prerelease" && "$VERSION" == "$newest" ]] && latest=true
          echo "Newest stable tag: v$newest; latest: $latest"
          printf '%s\n' "$NOTES" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "Lituus $VERSION" --notes-file notes.md --generate-notes $prerelease --latest="$latest"

  # The AUR packages are built and tested in a job of their own, without the AUR key: makepkg
  # runs every crate's build script and the tests, and none of that may reach the key. The job
  # after it only pushes the PKGBUILD tested here. Both packages are pushed only when both built,
  # so the AUR never has them at different versions.
  aur-test:
    name: AUR test (${{ matrix.pkg }})
    # Stable releases only, after the GitHub release (and its tarballs) exists.
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    container: docker.io/library/archlinux:base-devel
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        pkg: [lituus, lituus-bin]
    defaults:
      run:
        shell: bash
    steps:
      - name: Tools, and a user to build as (makepkg doesn't run as root)
        run: |
          pacman -Syu --noconfirm --needed git pacman-contrib namcap
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Checksums refreshed, dependencies installed, built, checked, linted and installed, as
      # packaging/aur/test.sh does.
      - name: Build, test and install
        env:
          PKG: ${{ matrix.pkg }}
        run: |
          dir="/home/builder/$PKG"
          cp -r "packaging/aur/$PKG" "$dir"
          sed -i -e "s/^pkgver=.*/pkgver=${GITHUB_REF_NAME#v}/" -e "s/^pkgrel=.*/pkgrel=1/" "$dir/PKGBUILD"
          chown -R builder: "$dir"
          cd "$dir"
          su builder -c "updpkgsums && makepkg --clean --cleanbuild --syncdeps --noconfirm"
          namcap PKGBUILD ./*.pkg.tar.zst
          pacman -U --noconfirm ./"$PKG"-[0-9]*.pkg.tar.zst
          lituus --version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aur-${{ matrix.pkg }}
          path: /home/builder/${{ matrix.pkg }}/PKGBUILD
          if-no-files-found: error

  aur:
    name: AUR (${{ matrix.pkg }})
    # Skipped with aur-test.
    needs: aur-test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        pkg: [lituus, lituus-bin]
    steps:
      # The PKGBUILD as tested, with its checksums.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aur-${{ matrix.pkg }}
          path: aur
      # Never over a newer version: runs of different tags aren't ordered, and an older tag's run
      # (or a re-run of its job) would otherwise push its version over the newer one.
      - name: Is the AUR's version older?
        id: aur
        shell: bash
        env:
          PKG: ${{ matrix.pkg }}
        run: |
          ours="${GITHUB_REF_NAME#v}-1"
          theirs=$(curl -fsS "https://aur.archlinux.org/rpc/v5/info?arg[]=$PKG" | jq -r '.results[0].Version // empty')
          if [ -n "$theirs" ] && [ "$theirs" != "$ours" ] &&
            [ "$(printf '%s\n' "$theirs" "$ours" | sort -V | tail -1)" = "$theirs" ]; then
            echo "::notice::The AUR has $PKG $theirs, newer than $ours: not pushed"
            echo "push=false" >> "$GITHUB_OUTPUT"
          else
            echo "The AUR has ${theirs:-no $PKG}; pushing $ours"
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi
      # Only writes .SRCINFO (makepkg --printsrcinfo reads just the PKGBUILD) and pushes both:
      # nothing is built next to the key.
      - uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        if: steps.aur.outputs.push == 'true'
        with:
          pkgname: ${{ matrix.pkg }}
          pkgbuild: aur/PKGBUILD
          updpkgsums: false
          test: false
          commit_username: giosuel
          commit_email: me@giosuel.ch
          commit_message: Update to ${{ github.ref_name }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
